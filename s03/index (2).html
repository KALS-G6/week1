<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박세연 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f3;
    --card: #ffffff;
    --text: #2b2b33;
    --muted: #6b6b78;
    --accent: #e8768f;
    --accent-soft: #fde7ec;
    --accent2: #5b8def;
    --accent2-soft: #e6eefd;
    --border: #efe6dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b22; --card: #26252e; --text: #f1eff4; --muted: #a8a6b3;
      --accent: #f28da3; --accent-soft: #3a2a31; --accent2: #86aaf5; --accent2-soft: #273046; --border: #34323d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b22; --card: #26252e; --text: #f1eff4; --muted: #a8a6b3;
    --accent: #f28da3; --accent-soft: #3a2a31; --accent2: #86aaf5; --accent2-soft: #273046; --border: #34323d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 64px; }
  header { text-align: center; margin-bottom: 40px; }
  .avatar {
    width: 112px; height: 112px; margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: grid; place-items: center;
    font-family: "Jua", sans-serif; font-size: 44px; color: var(--accent);
    border: 4px solid var(--card);
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 40px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 18px; }
  .cards { display: grid; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    display: flex; gap: 18px; align-items: center;
  }
  .icon {
    flex: none; width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center; font-size: 26px;
  }
  .pink { background: var(--accent-soft); }
  .blue { background: var(--accent2-soft); }
  .label { font-size: 14px; color: var(--muted); margin: 0; }
  .value { font-family: "Jua", sans-serif; font-size: 22px; margin: 2px 0 0; }
  .goal .value { color: var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar" aria-hidden="true">세연</div>
    <h1>박세연</h1>
    <p class="sub">안녕하세요! 중학교 1학년 학생이에요.</p>
  </header>

  <section class="cards">
    <div class="card">
      <div class="icon blue" aria-hidden="true">🏫</div>
      <div>
        <p class="label">학년</p>
        <p class="value">중학교 1학년</p>
      </div>
    </div>
    <div class="card">
      <div class="icon pink" aria-hidden="true">📖</div>
      <div>
        <p class="label">좋아하는 과목</p>
        <p class="value">국어</p>
      </div>
    </div>
    <div class="card goal">
      <div class="icon pink" aria-hidden="true">🎯</div>
      <div>
        <p class="label">나의 목표</p>
        <p class="value">기말고사 올백 맞기!</p>
      </div>
    </div>
  </section>

  <footer>만나서 반가워요 😊</footer>
</main>
</body>
</html>
